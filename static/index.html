<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoonReach Student Career Coach</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar card">
      <div class="sidebar-header">
        <h2>Sessions</h2>
        <button id="new-session-button" type="button">+ New</button>
      </div>
      <div id="session-list" class="session-list"></div>
    </aside>

    <div class="content-stack">
      <section class="hero">
        <div>
          <h1>MoonReach Workspace</h1>
          <p>Your persistent student career operating system for opportunities, planning, and coaching.</p>
        </div>
      </section>

      <section id="onboarding" class="card">
        <h2>Start your workspace</h2>
        <form id="onboarding-form">
          <label>
            University
            <input id="university" type="text" placeholder="e.g. University of Michigan" required />
          </label>
          <label>
            Major
            <input id="major" type="text" placeholder="e.g. Computer Science" required />
          </label>
          <label>
            Year / Standing
            <input id="year" type="text" placeholder="e.g. Junior" required />
          </label>
          <label>
            Career goals
            <textarea id="goals" placeholder="Describe your goals, e.g. internships, networking, job search" required></textarea>
          </label>
          <button type="submit">Create workspace</button>
        </form>
      </section>

      <section id="workspace-container" class="hidden">
        <div class="session-info card">
          <div>
            <p class="section-label">Active workspace</p>
            <h2 id="session-id">—</h2>
          </div>
          <button id="reset-session" type="button">New workspace</button>
        </div>

        <div id="session-context" class="card session-context hidden"></div>

        <div class="workspace-grid">
          <section class="card radar-panel">
            <div class="panel-header">
              <div>
                <p class="section-label">Career Radar</p>
                <h2>Persistent opportunities</h2>
              </div>
            </div>
            <div id="radar-list" class="radar-list"></div>
          </section>

          <section class="card plan-panel">
            <div class="panel-header">
              <div>
                <p class="section-label">Career Plan</p>
                <h2>Action items</h2>
              </div>
              <button id="generate-plan" type="button">Generate plan</button>
            </div>
            <div id="plan-output" class="plan-output hidden">
              <ol id="plan-list"></ol>
            </div>
          </section>
        </div>

        <section class="card chat-panel">
          <div class="panel-header">
            <div>
              <p class="section-label">Coach</p>
              <h2>Conversation and discovery</h2>
            </div>
          </div>
          <div id="message-area" class="chat-card"></div>
          <div id="chips" class="chips"></div>
          <div class="composer">
            <textarea id="message-input" placeholder="Ask about opportunities, internships, or next career steps..."></textarea>
            <div class="composer-actions">
              <button id="send-message" type="button">Send</button>
            </div>
          </div>
        </section>
      </section>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
